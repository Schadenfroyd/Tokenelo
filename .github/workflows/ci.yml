name: Source CI candidate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TOKENELO_LIVE: '0'
      TOKENELO_GOLDEN: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Several suites spawn or import the compiled output in dist, so build before testing.
      - run: npm run build
      - name: Test
        if: runner.os != 'Windows'
        run: npm test -- --maxWorkers=1
      # The API token writer fails closed unless a directory is owned by the current user. The hosted Windows
      # account is an elevated administrator whose new directories are owned by the Administrators group, so the
      # Windows suite runs as a standard local user, which mirrors a normal installation. The ownership check is unchanged.
      - name: Test as a standard user (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $user = 'tkci'
          $repo = $env:GITHUB_WORKSPACE
          $logDir = Join-Path $env:RUNNER_TEMP 'tkci'
          $node = (Get-Command node).Source
          $vitest = Join-Path $repo 'node_modules\vitest\vitest.mjs'
          if (-not (Test-Path -LiteralPath $vitest)) { throw "vitest entry not found: $vitest" }

          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $plain = 'Aa1!' + [Convert]::ToBase64String($bytes)
          Write-Host "::add-mask::$plain"
          $secure = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name $user -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\$user", $secure)

          function Grant([string]$Path, [string]$Rights) {
            & icacls $Path /grant "${user}:$Rights" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls failed for $Path" }
          }
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          Grant $logDir '(OI)(CI)M'
          Grant $repo '(OI)(CI)M'
          $parent = Split-Path -Parent $repo
          while ($parent -and $parent -ne (Split-Path -Parent $parent)) {
            Grant $parent '(X)'
            $parent = Split-Path -Parent $parent
          }

          function Invoke-AsUser([string]$Command, [string]$Name) {
            $out = Join-Path $logDir "$Name.out.txt"
            $err = Join-Path $logDir "$Name.err.txt"
            $p = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\cmd.exe') `
              -ArgumentList ('/d /s /c "' + $Command + '"') -Credential $cred -LoadUserProfile `
              -WorkingDirectory $repo -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
            $text = ''
            foreach ($file in @($out, $err)) {
              if (Test-Path -LiteralPath $file) { $text += (Get-Content -Raw -LiteralPath $file) }
            }
            Write-Host $text
            return [pscustomobject]@{ Code = $p.ExitCode; Text = $text }
          }

          # Show who the tests run as, and refuse to continue if that token is elevated.
          $who = Invoke-AsUser 'whoami /user && whoami /groups' 'whoami'
          if ($who.Code -ne 0) { throw "could not start a process as $user (exit $($who.Code))" }
          if ($who.Text -match 'High Mandatory Level') { throw "$user is elevated; the test user must be a standard user" }

          # The child inherits this step's environment (PATH, SystemRoot); only the per-user variables are replaced, so
          # temp files land in the new user's own profile and are owned by that user.
          $profileDir = Join-Path $env:SystemDrive "Users\$user"
          $tempDir = "$profileDir\AppData\Local\Temp"
          if (-not (Test-Path -LiteralPath $tempDir)) { throw "profile temp directory was not created: $tempDir" }
          $vars = @(
            'CI=true', 'TOKENELO_LIVE=0', 'TOKENELO_GOLDEN=0',
            "USERNAME=$user", "USERPROFILE=$profileDir", "HOMEDRIVE=$env:SystemDrive", "HOMEPATH=\Users\$user",
            "APPDATA=$profileDir\AppData\Roaming", "LOCALAPPDATA=$profileDir\AppData\Local", "TEMP=$tempDir", "TMP=$tempDir"
          )
          # TEMPORARY DIAGNOSTIC PROBE: remove after the log is read. It runs the product's own ACL script, extracted from
          # src/daemon/paths.ts, as this standard user and reports timing and stderr. It cannot fail the step.
          try {
            $probeSource = @'
          const { spawnSync, execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          try {
            const sysRoot = process.env.SystemRoot;
            if (!sysRoot) { console.log('PROBE no SystemRoot; not a Windows environment'); process.exit(0); }
            const src = fs.readFileSync(path.join(process.env.PROBE_REPO, 'src', 'daemon', 'paths.ts'), 'utf8');
            const open = 'const WINDOWS_ACL_SCRIPT = [';
            const start = src.indexOf(open);
            const end = src.indexOf("].join('\\n');", start);
            if (start < 0 || end < 0) { console.log('PROBE could not extract the ACL script'); process.exit(0); }
            const script = new Function('return [' + src.slice(start + open.length, end) + '].join("\\n")')();
            console.log('PROBE extracted the ACL script: ' + script.split('\n').length + ' lines');
            const psExe = path.win32.join(sysRoot, 'System32', 'WindowsPowerShell', 'v1.0', 'powershell.exe');
            const baseArgs = ['-NoLogo', '-NoProfile', '-NonInteractive'];
            const enc = baseArgs.concat(['-EncodedCommand', Buffer.from(script, 'utf16le').toString('base64')]);
            const minimal = { SystemRoot: sysRoot, windir: sysRoot };
            for (const name of ['TEMP', 'TMP']) { if (process.env[name]) minimal[name] = process.env[name]; }
            const withTarget = (env, mode, target) => Object.assign({}, env, { TOKENELO_ACL_TARGET: target, TOKENELO_ACL_MODE: mode });
            const piped = ['ignore', 'pipe', 'pipe'];
            const asProduct = ['ignore', 'pipe', 'ignore'];
            function runPs(label, args, env, stdio, timeout) {
              const t0 = process.hrtime.bigint();
              const r = spawnSync(psExe, args, { encoding: 'utf8', windowsHide: true, timeout, env, stdio, maxBuffer: 1 << 20 });
              const ms = Number((process.hrtime.bigint() - t0) / 1000000n);
              console.log('PROBE ' + label + ': elapsedMs=' + ms + ' status=' + r.status + ' signal=' + r.signal + ' error=' + (r.error ? (r.error.code || r.error.message) : 'none'));
              const out = (r.stdout || '').trim();
              const err = (r.stderr || '').trim();
              if (out) console.log('PROBE ' + label + ' stdout: ' + out.slice(0, 1200));
              if (err) console.log('PROBE ' + label + ' stderr: ' + err.slice(0, 2000));
            }
            const home = fs.mkdtempSync(path.join(os.tmpdir(), 'tokenelo-probe-'));
            const dataDir = path.join(home, 'data');
            fs.mkdirSync(dataDir, { recursive: true, mode: 0o700 });
            const files = ['1', '2', '3', '4'].map((n) => { const p = path.join(dataDir, 'api-token-' + n); fs.writeFileSync(p, 'synthetic-probe-token'); return p; });
            console.log('PROBE identity: user=' + process.env.USERNAME + ' tmp=' + os.tmpdir() + ' node=' + process.version);
            for (const p of [os.tmpdir(), home, dataDir]) {
              try { console.log('PROBE icacls ' + p + '\n' + execFileSync('icacls', [p], { encoding: 'utf8', timeout: 20000 }).trim()); }
              catch (e) { console.log('PROBE icacls failed for ' + p + ': ' + e.message); }
            }
            runPs('A1 trivial command, minimal env (cold)', baseArgs.concat(['-Command', "'ok'"]), minimal, piped, 20000);
            runPs('A2 trivial command, minimal env (warm)', baseArgs.concat(['-Command', "'ok'"]), minimal, piped, 20000);
            runPs('B1 directory mode, minimal env, stderr captured', enc, withTarget(minimal, 'directory', dataDir), piped, 20000);
            runPs('B2 file mode, minimal env, stderr captured', enc, withTarget(minimal, 'file', files[0]), piped, 20000);
            runPs('C1 directory mode, full env, stderr captured', enc, withTarget(process.env, 'directory', dataDir), piped, 20000);
            runPs('C2 file mode, full env, stderr captured', enc, withTarget(process.env, 'file', files[1]), piped, 20000);
            runPs('D1 directory mode, as the product runs it (5 s)', enc, withTarget(minimal, 'directory', dataDir), asProduct, 5000);
            runPs('D2 file mode, as the product runs it (5 s)', enc, withTarget(minimal, 'file', files[2]), asProduct, 5000);
            runPs('D3 file mode, product options but 20 s', enc, withTarget(minimal, 'file', files[3]), asProduct, 20000);
            try { fs.rmSync(home, { recursive: true, force: true }); } catch (e) { console.log('PROBE cleanup: ' + e.message); }
          } catch (e) { console.log('PROBE crashed: ' + (e && e.stack || e)); }
          '@
            [System.IO.File]::WriteAllText((Join-Path $logDir 'probe.cjs'), $probeSource, (New-Object System.Text.UTF8Encoding($false)))
            $probeCmd = (($vars | ForEach-Object { 'set "' + $_ + '"' }) -join '&& ') + '&& set "PROBE_REPO=' + $repo + '"&& "' + $node + '" "' + (Join-Path $logDir 'probe.cjs') + '"'
            $null = Invoke-AsUser $probeCmd 'probe'
          } catch { Write-Host "probe could not run: $_" }

          $inner = (($vars | ForEach-Object { 'set "' + $_ + '"' }) -join '&& ') + '&& "' + $node + '" "' + $vitest + '" run --maxWorkers=1'
          $run = Invoke-AsUser $inner 'vitest'
          exit $run.Code
      - run: npm audit --audit-level=high
      - name: Remove the Windows test user
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: Remove-LocalUser -Name tkci -ErrorAction SilentlyContinue
