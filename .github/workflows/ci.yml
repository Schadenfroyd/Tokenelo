name: Source CI candidate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TOKENELO_LIVE: '0'
      TOKENELO_GOLDEN: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Several suites spawn or import the compiled output in dist, so build before testing.
      - run: npm run build
      # TEMPORARY: records who owns a fresh temp directory on this runner (remove once the Windows result is understood).
      - name: Probe Windows directory ownership
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          $d = Join-Path $env:TEMP ('tokenelo-owner-probe-' + [guid]::NewGuid().ToString('N').Substring(0, 6))
          New-Item -ItemType Directory -Path $d | Out-Null
          $id = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          'current SID : ' + $id.User.Value
          'dir owner   : ' + [System.IO.Directory]::GetAccessControl($d).GetOwner([System.Security.Principal.SecurityIdentifier]).Value
          'admin role  : ' + ([System.Security.Principal.WindowsPrincipal]$id).IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)
          Remove-Item $d
      - run: npm test -- --maxWorkers=1
      - run: npm audit --audit-level=high
